[workspace]
resolver = "2"
members = ["crates/engine", "crates/store", "crates/geo", "crates/cli", "app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["Firat Baghirli"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/whilo-labs/whilo-trace"

[workspace.dependencies]
whilo-trace-engine = { path = "crates/engine" }
whilo-trace-store = { path = "crates/store" }
whilo-trace-geo = { path = "crates/geo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.41.0", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
dns-lookup = "4.0.2"
libc = "0.2.191"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2"
maxminddb = { version = "0.32.0", features = ["mmap"] }
flate2 = "1.1.10"
# ureq's hook for the crypto provider is outside its semver promise: stay on 3.5.x.
ureq = { version = "~3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
mmdb-writer = "=0.1.0"

[profile.release]
lto = "thin"
codegen-units = 4
